[package]
name = "cdk-ffi-kotlin"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
version = "0.18.0"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "cdk_ffi_kotlin"

[[bin]]
name = "uniffi-bindgen-kotlin"
path = "uniffi-bindgen.rs"

[dependencies]
cdk-ffi = { git = "https://github.com/cashubtc/cdk", rev = "f6f80aa8c988a8fbae496de0b7330035adf77b67", default-features = false, features = ["npubcash", "nwc", "bip353"] }
uniffi = { version = "0.30", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.30", features = ["build"] }

[lints]


[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
